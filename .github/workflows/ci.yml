name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Syntax and Bytecode Compilation Check
        run: |
          python -m py_compile client.py cli.py example.py test_sdk.py test_machine.py

      - name: Test CLI Interface
        run: |
          python cli.py --help
          python cli.py list --help
          python cli.py power --help

      - name: Test Package Build & Installation
        run: |
          pip install --upgrade pip build
          python -m build
          pip install .
          kargadan --help
